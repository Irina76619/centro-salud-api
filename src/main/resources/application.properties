spring.application.name=centro-salud-api
server.port=${PORT:8080}

# ---- Base de datos (en local usa estos valores; en la nube se sobreescriben con variables de entorno) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/centro_salud?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:admin}
# Pool pequeno: los planes gratuitos limitan las conexiones simultaneas
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}

# ---- JPA ----
# none: el esquema lo crea database/centro_salud.sql (JPA no toca las tablas)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:cambia-esta-clave-en-produccion-minimo-32-caracteres}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# ---- CORS: origenes permitidos (separados por coma). Admite comodines: https://*.vercel.app ----
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
