spring.application.name=centro-salud-api
server.port=${PORT:8080}

# ---- Base de datos (lee las variables de entorno de Render) ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Pool pequeno: los planes gratuitos limitan las conexiones simultaneas
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}

# ---- JPA ----
# none: el esquema lo crea database/centro_salud.sql (JPA no toca las tablas)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# ---- JWT ----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# ---- CORS: origenes permitidos (separados por coma). Admite comodines: https://*.vercel.app ----
app.cors.origins=${CORS_ORIGINS}
